# The nightly regression job of hardwood-benchmarks (nightly.sh), run by a systemd timer as
# the `build` user. It needs two fine-grained GitHub tokens, which this role does not manage:
# ~build/nightly/token-results (Contents: read and write on hardwood-benchmark-results only)
# and ~build/nightly/token-issues (Issues: read and write on hardwood only).
# Local time of the box (Europe/Berlin).
hardwood_nightly_time: "*-*-* 03:00:00"
# The hardwood-benchmarks ref the job runs (its nightly.sh and presets).
hardwood_nightly_bench_ref: origin/main
# Extra nightly.sh options: "--no-alert" while calibrating, "--commit <sha>" to measure one
# commit night after night.
hardwood_nightly_args: ""
hardwood_nightly_enabled: true
# The machine's name (lower-case letters, digits and dashes), required: its directory in
# hardwood-benchmark-results and the name of its failing-night issue. Written to
# /etc/hardwood-benchmarks/machine, where every regression run on the box reads it, the
# quick-against-nightly comparison included.
hardwood_nightly_machine: ""

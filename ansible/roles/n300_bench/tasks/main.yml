# Bench tooling for the N300 (n300/provision.md). Git comes from the base role, JDKs
# from SDKMan (also base) — no Fedora JDK.
- name: Have bench tools
  become: true
  become_user: root
  dnf: name={{item}} state=latest
  with_items:
     # JMH perf* profilers (perfasm, perfnorm, perfc2c)
     - perf
     # cpupower + turbostat, for clock pinning and checking it (n300/benchmark.md)
     - kernel-tools
     # sustained load for the clock/thermal checks (n300/benchmark.md)
     - stress-ng
     # Capstone backend for building hsdis (n300/provision.md §2)
     - capstone-devel
